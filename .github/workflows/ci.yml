name: Project checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix services/ai-service
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build --prefix services/ai-service
      - name: Backend regression tests
        run: npm test --prefix services/ai-service
        env:
          NODE_ENV: test
          LLM_PROVIDER: mock
          PAYMENT_PROVIDER: demo
          MONGODB_URI: mongodb://127.0.0.1:27017/voyana_test
